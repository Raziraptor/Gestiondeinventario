{% extends 'base.html' %}

{% block title %}Tu nombre{% endblock %}

{% block content %}
<div class="container-fluid mt-3 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <h1 class="page-title mb-2">¿Cómo te llamas?</h1>
                    <p class="text-muted">Tu nombre se mostrará a tus compañeros en departamentos e incidencias.</p>
                    <form method="post" action="{{ url_for('auth.perfil_nombre', next=siguiente) }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="nombre_completo" class="form-label">Nombre y apellidos</label>
                            <input id="nombre_completo" name="nombre_completo" class="form-control" required
                                   minlength="3" maxlength="120" autocomplete="name" value="{{ valor }}">
                            {% if error %}<div class="text-danger small mt-1" role="alert">{{ error }}</div>{% endif %}
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
